name: Uptime

# A cheap backstop, not a monitoring service: GitHub delays scheduled runs under
# load and disables them after 60 days without repository activity. Pair it with
# an external monitor.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Probe the API and storefront
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Probe
        id: probe
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          STOREFRONT_HEALTH_URL: ${{ vars.STOREFRONT_HEALTH_URL }}
        run: |
          failed=0
          status=""
          for variable in HEALTH_URL STOREFRONT_HEALTH_URL; do
            url="${!variable}"
            if [ -z "$url" ]; then
              echo "::error::$variable is not configured."
              code="not-configured"
              failed=1
            else
              code=$(curl -sS -o /dev/null -w "%{http_code}" --proto '=https' --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 5 "$url") || code="unreachable"
              if [ "$code" != "200" ]; then
                echo "::error::$variable returned $code."
                failed=1
              fi
            fi
            status="$status $variable=$code"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Raise an issue
        if: failure()
        uses: actions/github-script@v7
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status || 'no response' }}
        with:
          script: |
            const title = "Uptime: an application health check is failing"
            const body = `${process.env.PROBE_STATUS}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: "uptime",
            })

            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              })
              return
            }

            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ["uptime"],
            })

packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"
  - "packages/*"
allowBuilds:
  "@medusajs/telemetry": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  "multer@>=2.0.0 <2.4.0": "2.4.0"
  "lodash@>=4.0.0 <4.17.24": "4.18.1"
  "qs@>=6.0.0 <6.16.0": "6.16.0"
  "ajv@>=8.0.0 <8.18.0": "8.18.0"
  "morgan@>=1.0.0 <1.12.1": "1.12.1"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "js-yaml@>=3.0.0 <3.15.2": "3.15.2"
  "uuid@>=9.0.0 <11.1.1": "11.1.1"
  "csv-parse@>=5.0.0 <7.0.2": "7.0.2"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "ip-address@>=10.0.0 <10.7.4": "10.7.4"
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "1.14.5"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
  "compression@>=1.0.0 <1.8.2": "1.8.2"
  "@graphql-tools/utils@>=10.0.0 <12.0.2": "12.0.2"
  "postcss-selector-parser@>=6.0.0 <7.1.6": "7.1.6"
  "@opentelemetry/instrumentation-pg@>=0.50.0 <0.73.0": "0.73.0"
  "follow-redirects@>=1.16.0 <1.16.1": "1.16.1"
  "vite@>=7.0.0 <7.3.7": "7.3.7"
  # VitePress 1.x requests Vite 5; its Vue plugin supports Vite 6, where
  # current development-server security fixes are available.
  "vitepress>vite": "6.4.4"
  "@modelcontextprotocol/sdk@>=1.0.0 <1.32.0": "1.32.0"
  "hono@>=4.0.0 <4.13.11": "4.13.11"
  "@types/react": "19.0.5"
  "@types/react-dom": "19.0.5"
  # @medusajs/admin-vite-plugin pins fdir to exactly 6.1.1, whose optional
  # picomatch peer is 3.x, while the workspace resolves picomatch 4. fdir
  # 6.2.0 and later accept both (^3 || ^4), and the plugin only uses fdir's
  # directory crawling, not the glob matching picomatch backs. Same 6.x API.
  "@medusajs/admin-vite-plugin>fdir": "^6.5.0"
packageExtensions:
  # @medusajs/eslint-plugin 2.20.1 requires @typescript-eslint/typescript-estree
  # from three rules without declaring it, so under pnpm's strict layout
  # `medusa build` fails with "Cannot find module". Remove once the plugin
  # lists it itself.
  "@medusajs/eslint-plugin@2.20.1":
    dependencies:
      "@typescript-eslint/typescript-estree": "^8.0.0"
